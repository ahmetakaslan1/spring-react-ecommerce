version: '3.8'
name: java_lesson10

services:
  # 1. Spring Boot Uygulamamız (Bizim yazdığımız kod)
  app:
    build: . # Bulunduğum klasördeki Dockerfile'a bakarak imaj oluştur
    container_name: java_lesson10_app
    ports:
      - "8080:8080" # Senin bilgisayarının 8080 portunu, konteynerin 8080 portuna bağlar
    environment:
      # DİKKAT:  localhost kullanmıyoruz! Çünkü Docker içinde herkes ayrı bir bilgisayar gibidir.
      # Veritabanına ulaşmak için konteynerin ismini (postgres-db) ve iç portunu (5432) kullanmak zorundayız.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL}
      IYZICO_CALLBACK_URL: ${IYZICO_CALLBACK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      - postgres-db
      - mysql-db
    volumes:
      - product-images:/app/uploads
    restart: unless-stopped

  postgres-db:
    image: postgres:16
    container_name: java_lesson10_postgres
    environment:
      # NOT: Gerçek dünyada (Production) parolalar buraya açıkça yazılmaz.
      # Şirketler bunu '.env' dosyasından veya Vault gibi güvenli yerlerden çeker. (Örn: POSTGRES_USER: ${DB_USER})
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: java_lesson10_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    restart: unless-stopped
  # 4. FRONTEND (React + Vite → Nginx)
  frontend:
    build:
      context: ./frontend
    container_name: java_lesson10_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
  product-images:

